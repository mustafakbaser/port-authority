name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The port scanners are per-platform code paths; a green build on one OS proves nothing
    # about the other two.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run bundle -- --production

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The test host needs a display server on Linux.
      - run: xvfb-run -a npm run test:integration
        if: runner.os == 'Linux'
      - run: npm run test:integration
        if: runner.os != 'Linux'

  commit-messages:
    # Conventional Commits, checked with a regex rather than a toolchain. The project has
    # no runtime dependencies and this is not a good enough reason to add a build one.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,72}$'
          status=0
          for sha in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            subject=$(git log -1 --format=%s "$sha")
            if printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "ok   $subject"
            else
              echo "::error::Not a Conventional Commits subject: $subject"
              status=1
            fi
          done
          exit $status
